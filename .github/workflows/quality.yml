name: Quality

on:
  push:
    branches: [main, "chore/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.check }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        check: [lint, test:lint, typecheck, test, build, format:check]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read immutable container toolchain
        id: toolchain
        run: bash scripts/container-toolchain.sh >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ steps.toolchain.outputs.node_version }}
          cache: npm
      - name: Record actual Node and runner versions
        env:
          EXPECTED_NODE_VERSION: ${{ steps.toolchain.outputs.node_version }}
          NODE_IMAGE: ${{ steps.toolchain.outputs.node_image }}
        run: |
          test "$(node -p 'process.versions.node')" = "$EXPECTED_NODE_VERSION"
          node --version
          npm --version
          printf 'Container base: %s\nRunner: %s %s\n' "$NODE_IMAGE" "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
      - run: npm ci
      - run: npm run "${{ matrix.check }}"
      - name: Compiled server smoke test
        if: matrix.check == 'build'
        run: npm run test:production
