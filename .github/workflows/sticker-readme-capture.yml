name: README screenshots
on:
  pull_request:
    paths:
      - "scripts/capture-readme.mjs"
      - ".github/workflows/sticker-readme-capture.yml"
      - "client/**"
      - "server/**"
      - "package*.json"
permissions:
  contents: read
concurrency:
  group: readme-capture-${{ github.ref }}
  cancel-in-progress: true
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Read immutable container toolchain
        id: toolchain
        run: bash scripts/container-toolchain.sh >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ steps.toolchain.outputs.node_version }}
          cache: npm
      - name: Record actual Node and runner versions
        env:
          EXPECTED_NODE_VERSION: ${{ steps.toolchain.outputs.node_version }}
          NODE_IMAGE: ${{ steps.toolchain.outputs.node_image }}
        run: |
          test "$(node -p 'process.versions.node')" = "$EXPECTED_NODE_VERSION"
          node --version
          npm --version
          printf 'Container base: %s\nRunner: %s %s\n' "$NODE_IMAGE" "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
      - run: npm ci
      - run: npm run build
      - name: Validate disposable seed and explicit owner release before browser capture
        run: node scripts/capture-readme.mjs --seed-check
      - run: npx playwright install --with-deps chromium
      - name: Install Korean fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Capture actual app using isolated fictional data
        run: node scripts/capture-readme.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sticker-readme-screenshots
          path: docs/screenshots/*.png
          if-no-files-found: error
          retention-days: 7
