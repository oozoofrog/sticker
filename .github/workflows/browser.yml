name: Browser interactions

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Read immutable container toolchain
        id: toolchain
        run: bash scripts/container-toolchain.sh >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ steps.toolchain.outputs.node_version }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Install Korean fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Exercise desktop and mobile workflows with disposable fixtures
        run: npm run test:ui -- --reporter=list,html
      - name: Exercise explicit local-owner fixture without operational activation
        run: npx playwright test --config playwright.local-owner.config.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sticker-browser-evidence
          path: |
            playwright-report/
            test-results/
            playwright-report-local-owner/
            test-results-local-owner/
          if-no-files-found: ignore
          retention-days: 7
