name: sticker
services:
  sticker:
    image: ${STICKER_IMAGE:-sticker:local}
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${STICKER_PORT:-8787}:8787"
    environment:
      OWNER_PASSWORD: ${OWNER_PASSWORD:?Set OWNER_PASSWORD in .env before starting}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8787}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      DATA_DIR: /app/data
      HOST: 0.0.0.0
      PORT: 8787
      # Empty disables agent access. Nonempty requires compose.agents.yaml.
      # Keep this variable: old configured installs must fail, not silently lose agents.
      AGENT_CONFIG_PATH: ${AGENT_CONFIG_PATH:-}
      GITHUB_READ_ENABLED: ${GITHUB_READ_ENABLED:-false}
      GITHUB_CREDENTIAL_CONFIG_PATH: ${GITHUB_CREDENTIAL_CONFIG_PATH:-}
    volumes:
      - sticker_data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  # Explicitly targeted foreground STDIO only; ordinary `up` never starts this.
  mcp:
    image: ${STICKER_IMAGE:-sticker:local}
    profiles: [tools]
    init: true
    restart: "no"
    network_mode: service:sticker
    entrypoint: ["node", "dist/server/mcp.js"]
    command: []
    environment:
      STICKER_API_URL: http://127.0.0.1:8787
    stdin_open: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      disable: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  sticker_data:
